<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4b2e2e">
    <title>Brew Bliss Café - Home</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <h1>Brew Bliss Café ☕</h1>
        <nav>
            <ul>
                <li><a class="active" href="index.html">Home</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="order.html">Order</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-content">
        <section class="hero">
            <div class="hero-content">
                <h2>Freshly Brewed Happiness</h2>
                <p>Your daily dose of coffee and treats, just a click away.</p>
                <a href="#menu" class="btn">Explore Menu</a>
            </div>
        </section>

        <section id="menu" class="menu">
            <h2>Our Menu</h2>

            <div class="tabs">
                <button class="tab active" type="button" data-category="coffee">Coffee</button>
                <button class="tab" type="button" data-category="snacks">Snacks</button>
                <button class="tab" type="button" data-category="specials">Specials</button>
            </div>

            <div class="menu-grid" id="menuGrid"></div>
        </section>
    </main>

    <a href="cart.html" class="cart">🛒 Cart (<span id="cartCount">0</span>)</a>

    <footer>
        <p>© 2026 Brew Bliss Café | Crafted with ❤️</p>
        <p>Freshly brewed happiness, in every cup. ☕</p>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="js/home.js"></script>
</body>
</html>
